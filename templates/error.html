<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error {{ code }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { text-align: center; max-width: 480px; padding: 40px 24px; }
  .icon { width: 72px; height: 72px; background: #fef2f2; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          margin: 0 auto 24px; }
  .icon svg { width: 36px; height: 36px; color: #dc2626; }
  .code { font-size: 72px; font-weight: 700; color: #e2e8f0; line-height: 1; margin-bottom: 8px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
  p  { font-size: 14px; color: #64748b; margin-bottom: 28px; }
  a  { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px;
       background: #2563eb; color: #fff; border-radius: 8px; text-decoration: none;
       font-size: 14px; font-weight: 500; transition: background .15s; }
  a:hover { background: #1d4ed8; }
  a svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="container">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
  </div>
  <div class="code">{{ code }}</div>
  <h1>Something went wrong</h1>
  <p>{{ message }}</p>
  <a href="/dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
    </svg>
    Back to Dashboard
  </a>
</div>
</body>
</html>
